<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/>
    </marker>
    <style>
      .box{fill:#111827;stroke:#2b3a55;stroke-width:1.5}
      .t{fill:#f1f5f9;font-size:15px;font-weight:600}
      .s{fill:#94a3b8;font-size:12px}
      .k{fill:#22d3ee;font-size:12px;font-weight:600}
      .line{stroke:#64748b;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#0b0f17"/>
  <text x="40" y="44" fill="#f8fafc" font-size="22" font-weight="700">Meta-Router · Intelligent Agent Orchestrator</text>
  <text x="40" y="68" class="s">PS-05 · Google ADK + OpenAI (LiteLLM) · FastAPI · Firestore · Docker on Render · built in Google Antigravity</text>

  <!-- GCP boundary -->
  <rect x="200" y="92" width="975" height="640" rx="16" fill="none" stroke="#1e3a5f" stroke-dasharray="6 6"/>
  <text x="216" y="114" fill="#60a5fa" font-size="12" font-weight="600">Render · one Docker container (FastAPI + React)  ·  Firestore on Google Cloud (ps-05-512207)</text>

  <!-- user -->
  <rect x="30" y="300" width="140" height="92" rx="12" class="box"/>
  <text x="100" y="334" text-anchor="middle" class="t">User</text>
  <text x="100" y="354" text-anchor="middle" class="s">React UI (browser)</text>
  <text x="100" y="372" text-anchor="middle" class="s">query + CSV / code</text>

  <!-- API -->
  <rect x="230" y="300" width="160" height="92" rx="12" class="box"/>
  <text x="310" y="330" text-anchor="middle" class="t">FastAPI</text>
  <text x="310" y="350" text-anchor="middle" class="s">POST /api/chat</text>
  <text x="310" y="368" text-anchor="middle" class="s">streams events</text>
  <path d="M170,346 L226,346" class="line" marker-end="url(#arr)"/>

  <!-- Orchestrator big box -->
  <rect x="425" y="135" width="420" height="420" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".5" stroke-width="1.5"/>
  <text x="445" y="162" fill="#22d3ee" font-size="15" font-weight="700">Orchestrator</text>
  <path d="M390,346 L421,346" class="line" marker-end="url(#arr)"/>

  <rect x="450" y="178" width="370" height="78" rx="10" class="box"/>
  <text x="468" y="204" class="t">1 · Planner  <tspan class="s">(ADK LlmAgent, validated JSON)</tspan></text>
  <text x="468" y="226" class="s">intent classification + task decomposition</text>
  <text x="468" y="244" class="k">steps: [{id, intent, task, depends_on}]</text>

  <rect x="450" y="272" width="370" height="96" rx="10" class="box"/>
  <text x="468" y="298" class="t">2 · Router  <tspan class="s">(code, &lt; 5 ms)</tspan></text>
  <text x="468" y="320" class="k">0.5·match + 0.2·success + 0.15·health + 0.15·speed</text>
  <text x="468" y="340" class="s">health from in-memory cache · maintenance/offline excluded</text>
  <text x="468" y="358" class="s">ranked list + score breakdown per step</text>

  <rect x="450" y="384" width="370" height="96" rx="10" class="box"/>
  <text x="468" y="410" class="t">3 · Execute steps</text>
  <text x="468" y="432" class="s">dependency order · independent steps in parallel</text>
  <text x="468" y="450" class="s">output of step N → input of step N+1 (chaining)</text>
  <text x="468" y="468" class="s">timeout · empty · OUT_OF_SCOPE = failure</text>

  <path d="M635,256 L635,268" class="line" marker-end="url(#arr)"/>
  <path d="M635,368 L635,380" class="line" marker-end="url(#arr)"/>

  <!-- fallback & replan -->
  <rect x="450" y="494" width="178" height="48" rx="10" fill="#1f1708" stroke="#f59e0b" stroke-opacity=".7"/>
  <text x="539" y="514" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="600">Fallback</text>
  <text x="539" y="531" text-anchor="middle" fill="#d6a243" font-size="11">next agent in ranked list (≤3)</text>
  <rect x="642" y="494" width="178" height="48" rx="10" fill="#1a1530" stroke="#a78bfa" stroke-opacity=".7"/>
  <text x="731" y="514" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="600">Replan</text>
  <text x="731" y="531" text-anchor="middle" fill="#a99ad8" font-size="11">all failed → planner again (1/step)</text>
  <path d="M628,518 L638,518" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrP)"/>

  <!-- workers -->
  <rect x="885" y="135" width="270" height="420" rx="14" fill="#0f172a" stroke="#2b3a55"/>
  <text x="905" y="162" class="t">12 worker agents</text>
  <text x="905" y="180" class="s">ADK LlmAgents · gpt-5-mini via LiteLLM</text>
  <g font-size="12">
    <text x="905" y="210" fill="#e2e8f0">HRAssist</text>
    <text x="905" y="232" fill="#e2e8f0">FinanceBot <tspan fill="#fbbf24">(degraded)</tspan></text>
    <text x="905" y="254" fill="#e2e8f0">LegalReview <tspan fill="#fb923c">(maintenance)</tspan></text>
    <text x="905" y="276" fill="#e2e8f0">ComplianceChecker <tspan fill="#22d3ee">+ detect_pii</tspan></text>
    <text x="905" y="298" fill="#e2e8f0">DataCleaner <tspan fill="#22d3ee">+ clean_csv</tspan></text>
    <text x="905" y="320" fill="#e2e8f0">SalesInsight <tspan fill="#22d3ee">+ analyze_sales</tspan></text>
    <text x="905" y="342" fill="#e2e8f0">ReportWriter <tspan fill="#22d3ee">+ save_report</tspan></text>
    <text x="905" y="364" fill="#e2e8f0">SecurityScanner <tspan fill="#22d3ee">+ scan_code</tspan></text>
    <text x="905" y="386" fill="#e2e8f0">CodeHelper</text>
    <text x="905" y="408" fill="#e2e8f0">MeetingSummarizer</text>
    <text x="905" y="430" fill="#e2e8f0">TranslationAgent <tspan fill="#fb923c">(maintenance)</tspan></text>
    <text x="905" y="452" fill="#e2e8f0">CustomerFeedback</text>
  </g>
  <text x="905" y="490" class="s">Real tools: pandas cleaning &amp; sales</text>
  <text x="905" y="508" class="s">analysis, regex code &amp; PII scans,</text>
  <text x="905" y="526" class="s">reports saved to Firestore</text>
  <path d="M820,432 L881,432" class="line" marker-end="url(#arr)"/>
  <path d="M881,460 L820,460" class="line" marker-end="url(#arr)"/>
  <text x="850" y="424" text-anchor="middle" class="s">call</text>
  <text x="850" y="476" text-anchor="middle" class="s">result</text>

  <!-- telemetry / firestore / dashboard -->
  <rect x="425" y="610" width="200" height="90" rx="12" class="box"/>
  <text x="525" y="640" text-anchor="middle" class="t">Telemetry</text>
  <text x="525" y="660" text-anchor="middle" class="s">background writes</text>
  <text x="525" y="678" text-anchor="middle" class="s">in-memory metrics</text>
  <path d="M635,555 L560,606" class="line" marker-end="url(#arr)"/>

  <rect x="665" y="610" width="200" height="90" rx="12" class="box"/>
  <text x="765" y="640" text-anchor="middle" class="t">Firestore</text>
  <text x="765" y="660" text-anchor="middle" class="s">agents · requests</text>
  <text x="765" y="678" text-anchor="middle" class="s">eval_runs · artifacts</text>
  <path d="M625,655 L661,655" class="line" marker-end="url(#arr)"/>

  <rect x="905" y="610" width="250" height="90" rx="12" class="box"/>
  <text x="1030" y="640" text-anchor="middle" class="t">Dashboard</text>
  <text x="1030" y="660" text-anchor="middle" class="s">/api/metrics · /api/logs · /api/eval</text>
  <text x="1030" y="678" text-anchor="middle" class="s">accuracy · latency · fallbacks</text>
  <path d="M865,655 L901,655" class="line" marker-end="url(#arr)"/>

  <!-- stream back -->
  <path d="M310,392 L310,450 L100,450 L100,396" stroke="#22d3ee" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="205" y="468" text-anchor="middle" fill="#22d3ee" font-size="11">live trace: plan · routing · fallback · replan · result</text>
</svg>
